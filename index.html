<style>
:root{
 --green:#0C3A2D;--green2:#1F6B52;--mint:#E6F1EC;--gold:#C9A54A;--gold-ink:#8C6400;--gold-soft:#F6EFD9;
 --bg:#FAF8F3;--card:#fff;--line:#EAE5DA;--ink:#1C2420;--muted:#6E7772;--ok:#2E9E5B;--bad:#D9534F;
 --t0:#8A8F8C;--t1:#D23F3F;--t2:#2E9E5B;--t3:#2F6FD6;--t4:#8E44C9;
 --r:22px;--sh:0 1px 2px rgba(20,40,30,.04),0 8px 24px rgba(20,40,30,.06);
 --sans:Inter,"Noto Sans Bengali","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
 --zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.zh{font-family:var(--zh)}
#app{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom))}
#app.full{padding-bottom:24px}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t0{color:var(--t0)}
.py{color:var(--muted);font-weight:500}

/* bottom tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs .in{max-width:560px;margin:0 auto;display:flex}
#tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:12px;font-weight:600;color:var(--muted)}
#tabs a .ic{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:18px;transition:.2s}
#tabs a.on{color:var(--green)}#tabs a.on .ic{background:var(--mint)}
#tabs.hide{display:none}

/* building blocks */
.hello{color:var(--muted);font-size:15px}
h1{font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
h2{font-size:21px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px}
.label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 4px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
a.card,button.card{display:block;width:100%;text-align:left;transition:transform .15s}
a.card:active,button.card:active{transform:scale(.985)}
.row{display:flex;align-items:center;gap:14px}
.grow{flex:1;min-width:0}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:50px;background:var(--mint);color:var(--green)}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink)}
.bubble{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:var(--mint);flex:none}
.hero{background:linear-gradient(140deg,#0C3A2D,#1C5F49);color:#fff;border:0}
.hero .sub{color:#CFE5DA}
.go{display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--gold);color:#1C2420;font-weight:700;padding:11px 18px;border-radius:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:18px;background:var(--green);color:#fff;font-weight:700;font-size:17px}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok)}.btn.bad{background:transparent;color:var(--bad);border:1.5px solid rgba(217,83,79,.45)}
.btns{display:flex;gap:12px}.btns>*{flex:1}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:6px;transition:width .3s}
.ring{position:relative;flex:none;display:grid;place-items:center}.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-size:22px;font-weight:800;color:var(--green);line-height:1}.ring small{display:block;font-size:11px;color:var(--muted);text-align:center}
.arrow{color:#C9C3B6;font-size:20px}
.done{color:var(--ok);font-weight:700}
.top{display:flex;align-items:center;gap:6px;margin:-4px 0 12px -10px}
.back{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px}
.back:active{background:var(--mint)}
.top .t{font-weight:700;font-size:18px;line-height:1.2}.top .s{font-size:13px;color:var(--muted)}
.list a{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line)}
.list a:last-child{border-bottom:0}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:3px}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--green);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.set{padding:14px 0;border-bottom:1px solid var(--line)}.set:last-child{border-bottom:0}
.set .h{font-weight:600;margin-bottom:8px}
input[type=range]{width:100%;accent-color:var(--green)}
select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat b{display:block;font-size:24px;font-weight:800}.stat span{font-size:13px;color:var(--muted)}
.week{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:6px}
.week div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.week i{display:block;margin:0 auto 6px;width:100%;max-width:26px;border-radius:8px;background:var(--mint)}
.week i.full{background:var(--green)}

/* lesson player */
.play{min-height:calc(100vh - 40px);display:flex;flex-direction:column}
.play .head{display:flex;align-items:center;gap:10px}
.play .head .bar{flex:1;height:8px}
.play .count{font-size:14px;font-weight:700;color:var(--muted);min-width:44px;text-align:right}
.play .mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 0}
.big{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:34px 22px;text-align:center;box-shadow:var(--sh);animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.big .zh{font-weight:500;line-height:1.25;cursor:pointer}
.big .py{font-size:20px;margin-top:10px}
.say{width:54px;height:54px;border-radius:50%;background:var(--mint);color:var(--green);display:inline-grid;place-items:center;font-size:20px;margin-top:18px}
.say.on,.on>.say{background:var(--green);color:#fff}
.mean{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}
.mean b{display:block;font-size:21px;color:var(--green)}
.mean span{display:block;color:var(--muted);font-size:15px;margin-top:4px}
.note{margin-top:12px;background:var(--gold-soft);color:#7A6020;border-radius:12px;padding:10px;font-size:14px}
.listen{width:116px;height:116px;border-radius:50%;background:var(--mint);font-size:50px;display:inline-grid;place-items:center}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;font-size:17px;margin-top:10px}
.opt.right{border:2px solid var(--ok);background:rgba(46,158,91,.1);font-weight:600}.opt.wrong{border:2px solid var(--bad);background:rgba(217,83,79,.08)}
.chat{display:flex;flex-direction:column;gap:12px;margin:8px 0 18px}
.msg{max-width:84%;padding:12px 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);cursor:pointer;align-self:flex-start;border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--green);color:#fff;border:0;border-radius:22px;border-bottom-right-radius:6px}
.msg .zh{font-size:21px;line-height:1.4}.msg .py{font-size:14px}.msg.me .py{color:rgba(255,255,255,.75)}
.msg .m{font-size:15px;color:var(--muted);margin-top:4px}.msg.me .m{color:#CFE5DA}
.msg.say{outline:2px solid var(--gold)}
.hide-m .m{display:none}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pill{background:var(--green);color:#fff;font-weight:600;padding:9px 16px;border-radius:50px;font-size:14px}
.pill.light{background:var(--mint);color:var(--green)}
.gp{margin-top:14px}
.gp .n{width:30px;height:30px;border-radius:50%;background:var(--gold-soft);color:var(--gold-ink);font-weight:700;font-size:14px;display:grid;place-items:center;flex:none}
.gp .t{font-weight:700;font-size:18px;color:var(--green)}
.ex{display:flex;align-items:center;gap:10px;background:rgba(230,241,236,.65);border-radius:14px;padding:12px;margin-top:10px;cursor:pointer;width:100%;text-align:left}
.ex .zh{font-size:19px}.ex .py{font-size:14px}.ex .m{font-size:14px;color:var(--muted)}
.sticky{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}

/* onboarding */
.welcome{position:fixed;inset:0;z-index:40;background:linear-gradient(170deg,#0C3A2D,#155A45);color:#fff;display:flex;flex-direction:column;padding:max(24px,env(safe-area-inset-top)) 26px max(22px,env(safe-area-inset-bottom));overflow:auto}
.welcome .in{max-width:520px;width:100%;margin:auto;flex:1;display:flex;flex-direction:column;justify-content:center}
.welcome .e{font-size:54px}.welcome h1{font-size:32px;margin:14px 0 4px}.welcome .bn{color:#E9D9A6;font-size:19px;font-weight:600}
.welcome p{color:#DCEBE3;font-size:17px;line-height:1.6;margin-top:16px}.welcome p.b{font-size:16px;color:#C6DCD1}
.dots{display:flex;gap:8px;justify-content:center;margin:18px 0}.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3)}.dots i.on{width:24px;border-radius:5px;background:var(--gold)}
.welcome .btn{background:var(--gold);color:#1C2420}
.welcome .skip{color:#CFE5DA;font-weight:600;padding:14px;display:block;margin:0 auto}
.choose{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.choose button{text-align:left;padding:14px 16px;border-radius:16px;border:1.5px solid rgba(255,255,255,.22);color:#fff;font-weight:600}
.choose button.on{background:#fff;color:var(--green);border-color:#fff}
.choose small{display:block;font-weight:400;opacity:.8;font-size:13px}
.welcome .q{font-weight:700;margin-top:22px}

/* dialog */
.dlg{position:fixed;inset:0;background:rgba(10,30,22,.45);z-index:50;display:grid;place-items:center;padding:24px}
.dlg .card{max-width:380px;text-align:center;padding:26px}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
.foot a{text-decoration:underline}
@media (min-width:700px){#app{padding-top:36px}h1{font-size:34px}}
</style>

<noscript><p style="padding:20px">Dawah Chinese needs JavaScript. You can still <a href="dawah/read/">read the book online</a>.</p></noscript>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=$('#app'),tabs=$('#tabs');

// ---------- storage (this device only) ----------
const KEY='dc:v2';
let S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
S=Object.assign({onb:false,bn:true,goal:10,start:0,done:{},box:{},act:{}},S);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const tr=(en,bn)=>S.bn?bn:en;
const meaning=i=>S.bn?(i.bn||i.en):i.en;
const day=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayNum=(d=new Date())=>Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5);
function readerDone(){try{return new Set(JSON.parse(localStorage.getItem('rd:done')||'[]'))}catch(e){return new Set()}}
function readerAct(){try{return JSON.parse(localStorage.getItem('rd:act')||'{}')}catch(e){return {}}}
function points(d){const k=day(d);return (S.act[k]||0)+(readerAct()[k]||0)*3}
let celebrate=false;
function log(n){const k=day(),b=points();S.act[k]=(S.act[k]||0)+n;if(b<S.goal&&b+n>=S.goal)celebrate=true;save()}
function streak(){let d=new Date();if(!points(d))d.setDate(d.getDate()-1);let n=0;while(points(d)>0){n++;d.setDate(d.getDate()-1)}return n}
const GAPS=[0,1,3,7,16,35];
function review(zh,ok){const b=ok?Math.min(5,((S.box[zh]||[0])[0])+1):1;S.box[zh]=[b,dayNum()+GAPS[b]];log(1)}
const wordsKnown=()=>Object.values(S.box).filter(v=>v[0]>=2).length;

// ---------- content ----------
let C=null,ALL=[],SENT=[];
const lessons=l=>l.sections.flatMap(s=>s.units);
function lessonById(id){for(const l of C.levels)for(const u of lessons(l))if(u.id===id)return [l,u];return null}
function readTarget(u){const p=(window.BOOK||[]).find(b=>b.u===u.page+'.html');if(!p)return null;
 const s=p.s.find(x=>x[1].replace(/\s+/g,' ').startsWith(u.sec+' '))||p.s[0];return {href:'dawah/read/'+p.u+'#'+s[0],key:p.u+'#'+s[0]}}
function isDone(u){if(u.type==='read'){const t=readTarget(u);return !!S.done[u.id]||(t&&readerDone().has(t.key))}return !!S.done[u.id]}
function markLesson(id){if(!S.done[id]){S.done[id]=1;log(3)}else save()}
function nextLesson(){const lv=C.levels;for(const l of lv.filter(l=>l.id>=S.start).concat(lv.filter(l=>l.id<S.start)))for(const u of lessons(l))if(!isDone(u))return [l,u];return null}
function due(){const t=dayNum(),seen=new Set();return ALL.filter(i=>{const b=S.box[i.zh];if(!b||b[1]>t||seen.has(i.zh))return false;seen.add(i.zh);return true})}
function bookSections(){return (window.BOOK||[]).flatMap(p=>p.s.map(s=>({p,id:s[0],t:s[1].replace(/\s+/g,' '),key:p.u+'#'+s[0]})))}
function nextSection(){const d=readerDone();return bookSections().find(s=>!d.has(s.key))}
const lessonHref=u=>u.type==='read'?(readTarget(u)||{href:'dawah/read/'}).href:'#/lesson/'+u.id;
const emoji=t=>({words:'🔤',listen:'🎧',dialogue:'🗣',grammar:'🧩',read:'📖'}[t]||'💬');
const size=u=>u.type==='grammar'?u.points.length:u.type==='read'?1:u.items.length;
function sub(u){const n=size(u);return u.type==='read'?tr('Read in the book','বই থেকে পড়ো'):u.type==='grammar'?tr(n+' patterns',n+'টি নিয়ম'):u.type==='dialogue'?tr(n+' lines',n+' লাইন'):tr(n+' cards',n+'টি কার্ড')}

// ---------- small views ----------
function py(i){if(!i.pc||!i.pc.length)return esc(i.py);return i.pc.map(([t,n])=>n<0?esc(t):`<span class="t${n}">${esc(t)}</span>`).join('')}
function ring(p,sz,inner,col){const w=sz>100?14:9,r=(sz-w)/2,c=2*Math.PI*r;p=Math.max(0,Math.min(1,p));
 return `<div class="ring" style="width:${sz}px;height:${sz}px"><svg width="${sz}" height="${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#EAE5DA" stroke-width="${w}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col||'#0C3A2D'}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c*p} ${c}"/></svg><div>${inner}</div></div>`}
const bar=p=>`<div class="bar"><i style="width:${Math.round(Math.max(0,Math.min(1,p))*100)}%"></i></div>`;
const top=(t,s,back)=>`<div class="top"><a class="back" href="${back||'javascript:history.back()'}" aria-label="${tr('Back','পেছনে')}">←</a><div class="grow"><div class="t">${esc(t)}</div>${s?`<div class="s">${esc(s)}</div>`:''}</div></div>`;
function speak(t,el){if(window.Zh)Zh.speak(t,el)}
function cardSize(z){const n=z.length;return n<=2?64:n<=4?52:n<=8?38:n<=14?30:25}

// ---------- screens ----------
function today(){
 const pts=points(),g=S.goal,st=streak(),nx=nextLesson(),dn=due().length,rd=nextSection();
 const sod=SENT[dayNum()%SENT.length];
 const h=new Date().getHours();
 return `<div class="row"><div class="grow"><div class="hello">${tr('Assalamu alaikum','আসসালামু আলাইকুম')}</div><h1>${tr('Today','আজ')}</h1></div><span class="chip gold">🔥 ${st} ${tr(st===1?'day':'days','দিন')}</span></div>
 <div class="card" style="margin-top:16px"><div class="row">${ring(pts/g,84,`<b>${pts}</b><small>/ ${g}</small>`)}
  <div class="grow"><h2>${pts>=g?tr('Goal reached, alhamdulillah','লক্ষ্য পূরণ, আলহামদুলিল্লাহ'):tr('Daily goal','আজকের লক্ষ্য')}</h2>
  <div class="sub">${tr('A card is 1 point; a lesson or a book section is 3.','প্রতি কার্ডে ১ পয়েন্ট; একটা পাঠ বা বইয়ের অংশে ৩।')}</div></div></div></div>
 ${nx?`<a class="card hero" href="${lessonHref(nx[1])}" style="margin-top:12px"><span class="chip gold">${esc(S.bn?nx[0].bn:nx[0].title)} · ${esc(nx[0].hsk)}</span>

let P=null; // player state for the current lesson
function lesson(id){
 const f=lessonById(id);if(!f)return path();const [l,u]=f;
 if(u.type==='read'){location.replace(lessonHref(u));return ''}
 if(u.type==='dialogue')return dialogue(l,u);
 if(u.type==='grammar')return grammar(l,u);
 if(!P||P.id!==id)P={id,items:u.items,i:0,show:false,knew:0,listen:u.type==='listen',lesson:u,level:l};
 return cards();
}
function cards(){
 const n=P.items.length,back=P.lesson?'#/level/'+P.level.id:'#/today';
 const head=`<div class="head"><a class="back" href="${back}" aria-label="${tr('Close','বন্ধ')}">✕</a>${bar(P.i/n)}<span class="count">${Math.min(P.i,n)}/${n}</span></div>`;
 if(P.i>=n){
  if(P.lesson&&!P.marked){P.marked=1;markLesson(P.id)}
  const nx=P.lesson?nextLesson():null;
  return `<div class="play">${head}<div class="mid" style="text-align:center;align-items:center">${ring(n?P.knew/n:1,150,`<b style="font-size:30px">${P.knew}/${n}</b>`,'#2E9E5B')}
  <h1 style="margin-top:22px">${tr("Masha'Allah, done!",'মাশাআল্লাহ, শেষ!')}</h1><div class="sub" style="margin-top:8px">${tr('Cards you missed will come back in Review tomorrow.','যেগুলো পারোনি, কাল রিভিউতে আবার আসবে।')}</div></div>
  <div style="display:flex;flex-direction:column;gap:10px">${nx?`<a class="btn" href="${lessonHref(nx[1])}">${tr('Next','পরের পাঠ')}: ${esc(nx[1].title)}</a>`:''}
  ${P.lesson&&n>=4?`<a class="btn ghost" href="#/quiz/${P.id}">${tr('Quick quiz','ছোট্ট কুইজ')}</a>`:''}<a class="btn ghost" href="${back}">${tr('Back','ফিরে যাও')}</a></div></div>`}
 const it=P.items[P.i],fs=cardSize(it.zh),other=S.bn?it.en:it.bn;
 const face=P.listen&&!P.show?`<button class="listen" data-say="${esc(it.zh)}">🎧</button><div class="sub" style="margin-top:16px">${tr('Listen. What does it mean?','শোনো। এর অর্থ কী?')}</div>`:
  `<div class="zh" data-say="${esc(it.zh)}" style="font-size:${fs}px">${esc(it.zh)}</div><div class="py">${py(it)}</div><button class="say" data-say="${esc(it.zh)}" aria-label="${tr('Listen','শোনো')}">▶</button>`;
 const mean=P.show?`<div class="mean"><b>${esc(meaning(it))}</b>${other&&other!==meaning(it)?`<span>${esc(other)}</span>`:''}${it.n?`<div class="note">${esc(it.n)}</div>`:''}</div>`:'';
 return `<div class="play">${head}<div class="sub" style="margin:6px 0 0 8px">${esc(P.lesson?P.lesson.title:tr('Review','রিভিউ'))}</div>
 <div class="mid"><div class="big" key="${P.i}">${face}${mean}</div></div>
 ${P.show?`<div class="btns"><button class="btn bad" data-ans="0">${tr('Again','আবার')}</button><button class="btn ok" data-ans="1">${tr('I know it','পারি')}</button></div>`:`<button class="btn" id="reveal">${tr('Show meaning','অর্থ দেখাও')}</button>`}</div>`;
}

function dialogue(l,u){
 const ok=isDone(u);
 return top(u.title,tr('Dialogue · tap a line to hear it','সংলাপ · শুনতে লাইনে চাপো'),'#/level/'+l.id)+
 `<div class="toolbar"><button class="pill" id="playall">▶ ${tr('Play all','সব শোনো')}</button><button class="pill light" id="togm">${tr('Hide meanings','অর্থ লুকাও')}</button></div>
 <div class="chat" id="chat">${u.items.map(i=>`<div class="msg ${i.s==='A'?'me':''}" data-say="${esc(i.zh)}"><div class="zh">${esc(i.zh)}</div><div class="py">${i.s==='A'?esc(i.py):py(i)}</div><div class="m">${esc(meaning(i))}</div></div>`).join('')}</div>
 <div class="sticky">${ok?`<a class="btn ghost" href="#/level/${l.id}">✓ ${tr('Done · Back','শেষ · ফিরে যাও')}</a>`:`<button class="btn" data-mark="${u.id}" data-back="#/level/${l.id}">${tr('Mark as done ✓','শেষ করেছি ✓')}</button>`}</div>`;
}

function grammar(l,u){
 const ok=isDone(u);
 return top(u.title,tr(u.points.length+' patterns · tap an example to hear it',u.points.length+'টি নিয়ম · উদাহরণে চাপলে শুনবে'),'#/level/'+l.id)+
 u.points.map((p,k)=>`<div class="card gp"><div class="row" style="gap:10px"><span class="n">${k+1}</span><span class="t grow zh">${esc(p.t)}</span></div>
 <div style="margin-top:10px;line-height:1.6">${esc(tr(p.en,p.bn||p.en))}</div>
 ${p.ex.map(e=>`<button class="ex" data-say="${esc(e.zh)}"><div class="grow"><div class="zh">${esc(e.zh)}</div><div class="py">${py(e)}</div><div class="m">${esc(meaning(e))}</div></div><span style="color:var(--green2)">▶</span></button>`).join('')}</div>`).join('')+
 `<div class="sticky">${ok?`<a class="btn ghost" href="#/level/${l.id}">✓ ${tr('Learned · Back','শিখেছি · ফিরে যাও')}</a>`:`<button class="btn" data-mark="${u.id}" data-back="#/level/${l.id}">${tr('Mark as learned ✓','শিখেছি ✓')}</button>`}</div>`;
}

let Q=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function quiz(id){
 const f=lessonById(id);if(!f)return path();const [l,u]=f;
 if(!Q||Q.id!==id){const uniq=(a)=>{const s=new Set();return a.filter(i=>{const m=meaning(i);if(s.has(m))return false;s.add(m);return true})};
  const pool=uniq(u.items.concat(lessons(l).flatMap(x=>x.items||[]))).map(meaning);
  Q={id,l,i:0,score:0,picked:null,qs:shuffle(uniq(u.items)).slice(0,10).map(it=>{const r=meaning(it),o=shuffle(shuffle(pool.filter(m=>m!==r)).slice(0,3).concat([r]));return {it,o,a:o.indexOf(r)}})}}
 const n=Q.qs.length,head=`<div class="head"><a class="back" href="#/level/${l.id}">✕</a><div class="bar" style="flex:1;height:8px"><i style="width:${Q.i/n*100}%;background:var(--gold)"></i></div><span class="count" style="color:var(--gold-ink)">⭐ ${Q.score}</span></div>`;
 if(Q.i>=n)return `<div class="play">${head}<div class="mid" style="text-align:center;align-items:center">${ring(Q.score/n,150,`<b style="font-size:30px">${Q.score}/${n}</b>`,'#C9A54A')}<h1 style="margin-top:22px">${Q.score*10>=n*8?tr('Excellent!','চমৎকার!'):tr('Good effort!','ভালো চেষ্টা!')}</h1></div>
  <div style="display:flex;flex-direction:column;gap:10px"><button class="btn" id="qagain">${tr('Try again','আবার চেষ্টা')}</button><a class="btn ghost" href="#/level/${l.id}">${tr('Done','শেষ')}</a></div></div>`;
 const q=Q.qs[Q.i];
 return `<div class="play">${head}<div class="mid" style="text-align:center"><div class="sub">${tr('What does this mean?','এর অর্থ কী?')}</div>
 <div class="zh" data-say="${esc(q.it.zh)}" style="font-size:${cardSize(q.it.zh)}px;margin-top:12px;cursor:pointer">${esc(q.it.zh)}</div><div class="py" style="font-size:19px">${py(q.it)}</div></div>
 <div>${q.o.map((o,k)=>`<button class="opt ${Q.picked!==null&&k===q.a?'right':Q.picked===k?'wrong':''}" data-opt="${k}">${esc(o)}</button>`).join('')}</div><div style="height:12px"></div></div>`;
}

function reviewScreen(){
 if(!P||P.id!=='review'){const d=shuffle(due()).slice(0,30);if(!d.length)return top(tr('Review','রিভিউ'),'','#/today')+
  `<div class="card" style="text-align:center;padding:40px 20px"><div style="font-size:60px">🌙</div><h2 style="margin-top:10px">${tr('Nothing to review now','এখন রিভিউ করার কিছু নেই')}</h2><div class="sub" style="margin:8px 0 22px">${tr('Learn new cards today; they come back here at the right time.','আজ নতুন কার্ড শেখো; ঠিক সময়ে এগুলো এখানে ফিরে আসবে।')}</div><a class="btn" href="#/today">${tr('Back','ফিরে যাও')}</a></div>`;
  P={id:'review',items:d,i:0,show:false,knew:0,listen:false,lesson:null}}
 return cards();
}

// ---------- router ----------
let lastSpoken=null;
function render(){
 const h=location.hash.replace(/^#\/?/,'')||'',[r,a]=h.split('/');
 if(!S.onb&&r!=='welcome'){location.replace('#/welcome');return}
 document.querySelectorAll('[data-l]').forEach(e=>{const [en,bn]=e.dataset.l.split('|');e.textContent=tr(en,bn)});
 const tab=['today','path','book','me'].includes(r)?r:(r==='level'?'path':r==='part'?'book':null);
 tabs.classList.toggle('hide',!tab||r==='welcome');
 tabs.querySelectorAll('a').forEach(x=>x.classList.toggle('on',x.dataset.t===tab));
 app.classList.toggle('full',!tab);
 if(r!=='lesson'&&r!=='review')P=null;
 if(r!=='quiz')Q=null;
 let html;
 switch(r){
  case 'welcome':html=welcome();break;
  case 'path':html=path();break;
  case 'level':html=level(a);break;
  case 'lesson':html=lesson(a);break;
  case 'quiz':html=quiz(a);break;
  case 'review':html=reviewScreen();break;
  case 'book':html=book();break;
  case 'part':html=part(+a);break;
  case 'me':html=me();break;
  case 'about':html=about();break;
  default:html=today();
 }
 app.innerHTML=html;
 if(celebrate){celebrate=false;showDlg('🎉',tr('Daily goal reached!','আজকের লক্ষ্য পূরণ!'),tr('Alhamdulillah. Come back tomorrow to keep your streak.','আলহামদুলিল্লাহ। কাল আবার এসো, ধারাবাহিকতা ধরে রাখো।'))}
 // speak the new card or quiz word once
 const say=(r==='lesson'&&P&&P.i<P.items.length&&P.items[P.i].zh)||(r==='quiz'&&Q&&Q.i<Q.qs.length&&Q.picked===null&&Q.qs[Q.i].it.zh)||null;
 const tag=r+(P?P.i:'')+(Q?Q.i:'')+say;
 if(say&&tag!==lastSpoken){lastSpoken=tag;speak(say)}
 if(!say)lastSpoken=null;
}
function rerender(keepScroll){const y=scrollY;render();if(keepScroll)scrollTo(0,y)}
function showDlg(e,t,s){const d=document.createElement('div');d.className='dlg';d.innerHTML=`<div class="card"><div style="font-size:52px">${e}</div><h2 style="margin:8px 0">${esc(t)}</h2><div class="sub" style="margin-bottom:20px">${esc(s)}</div><button class="btn">${tr('OK','ঠিক আছে')}</button></div>`;
 d.onclick=ev=>{if(ev.target===d||ev.target.closest('.btn'))d.remove()};document.body.appendChild(d)}

addEventListener('hashchange',()=>{render();scrollTo(0,0)});
document.addEventListener('click',e=>{
 const t=e.target;let x;
 if(x=t.closest('#wnext')){if(wPage>=PURPOSE.length){S.onb=true;save();location.replace('#/today')}else{wPage++;render()}return}
 if(t.closest('#wskip')){wPage=PURPOSE.length;render();return}
 if(x=t.closest('.choose button')){const k=x.parentNode.dataset.w;S[k]=k==='bn'?x.dataset.v==='1':+x.dataset.v;save();render();return}
 if(x=t.closest('.seg button')){const k=x.parentNode.dataset.set;S[k]=k==='bn'?x.dataset.v==='1':+x.dataset.v;save();rerender(true);return}
 if(t.closest('#reveal')){P.show=true;render();return}
 if(x=t.closest('[data-ans]')){const ok=x.dataset.ans==='1';review(P.items[P.i].zh,ok);if(ok)P.knew++;P.i++;P.show=false;render();return}
 if(x=t.closest('[data-opt]')){if(Q.picked!==null)return;const k=+x.dataset.opt,q=Q.qs[Q.i],ok=k===q.a;Q.picked=k;if(ok)Q.score++;review(q.it.zh,ok);rerender(true);
  setTimeout(()=>{Q.picked=null;Q.i++;render()},1000);return}
 if(t.closest('#qagain')){Q.i=0;Q.score=0;Q.qs=shuffle(Q.qs);render();return}
 if(x=t.closest('[data-mark]')){markLesson(x.dataset.mark);location.hash=x.dataset.back;return}
 if(t.closest('#togm')){const c=$('#chat');c.classList.toggle('hide-m');t.closest('#togm').textContent=c.classList.contains('hide-m')?tr('Show meanings','অর্থ দেখাও'):tr('Hide meanings','অর্থ লুকাও');return}
 if(x=t.closest('#playall')){playAll(x);return}
 if(t.closest('#share')){const u='https://israfil-hossen.github.io/hsk-vocab/';if(window.Zh&&Zh.share)Zh.share('Dawah Chinese · 认识真主',u);else if(navigator.share)navigator.share({title:'Dawah Chinese',url:u}).catch(()=>{});return}
 if(t.closest('#reset')){if(confirm(tr('Delete all progress on this device?','এই ডিভাইসের সব অগ্রগতি মুছে ফেলবে?'))){const keep=S.onb;S={onb:keep,bn:S.bn,goal:S.goal,start:S.start,done:{},box:{},act:{}};save();try{localStorage.removeItem('rd:done');localStorage.removeItem('rd:act')}catch(e){}render()}return}
 if(x=t.closest('[data-say]')){speak(x.dataset.say,x.classList.contains('msg')?x:x.querySelector('.say')||x);return}
});
document.addEventListener('input',e=>{if(e.target.id==='rate'){const r=parseFloat(e.target.value);if(window.Zh)Zh.setRate(r);const v=$('#rv');if(v)v.textContent=r.toFixed(2)+'×'}});
document.addEventListener('change',e=>{if(e.target.id==='voice'&&window.Zh){Zh.setVoice(e.target.value);Zh.speak('你好',null,{tts:true})}});
document.addEventListener('zhvoices',()=>{if(/^#\/me/.test(location.hash))rerender(true)});
let playing=false;
async function playAll(btn){if(playing){playing=false;btn.textContent='▶ '+tr('Play all','সব শোনো');if(window.speechSynthesis)speechSynthesis.cancel();return}
 playing=true;btn.textContent='■ '+tr('Stop','থামাও');
 for(const m of document.querySelectorAll('#chat .msg')){if(!playing)break;m.scrollIntoView({block:'center',behavior:'smooth'});await (window.Zh?Zh.speak(m.dataset.say,m):Promise.resolve());await new Promise(r=>setTimeout(r,350))}
 playing=false;if(btn.isConnected)btn.textContent='▶ '+tr('Play all','সব শোনো')}

fetch('app/content.json').then(r=>r.json()).then(c=>{C=c;
 ALL=C.levels.flatMap(l=>lessons(l).flatMap(u=>u.items||[]));
 SENT=C.levels.flatMap(l=>lessons(l).filter(u=>u.type==='cards'||u.type==='listen').flatMap(u=>u.items)).filter(i=>i.zh.length>=5);
 render()}).catch(()=>{app.innerHTML=`<div class="card" style="margin-top:30vh">${tr('Could not load the lessons. Check your connection and reload.','পাঠ লোড হয়নি। ইন্টারনেট দেখে আবার চেষ্টা করো।')}</div>`});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
