name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'dawah/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (Android 16)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/android-sdk"; mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/tools.zip -d "$SDK/cmdline-tools" && mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM=$(ls "$SDK"/cmdline-tools/latest/bin/sdkmanager 2>/dev/null || ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -3
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Lesson audio into the app
        run: python3 tools/app_audio.py

      - name: Build app bundle and test APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace bundleRelease assembleDebug 2>&1 | tee ../build.log

      # Store screenshots: start the test APK on an emulator and capture each screen.
      - name: Enable KVM for the emulator
        if: success()
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshots
        if: success()
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android/shots.sh /tmp/out/shots

      - name: Keep the builds as an artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dawah-chinese-builds
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk

      # Publish the unsigned bundle, the test APK and the build log on a separate branch (also when the build fails).
      - name: Publish builds to the android-build branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp android/app/build/outputs/bundle/release/*.aab /tmp/out/ 2>/dev/null || true
          cp android/app/build/outputs/apk/debug/*.apk /tmp/out/ 2>/dev/null || true
          tail -c 200000 build.log > /tmp/out/build.log 2>/dev/null || echo "no build log" > /tmp/out/build.log
          echo "${{ job.status }} ${GITHUB_SHA}" > /tmp/out/status.txt
          cd /tmp/out
          git init -q -b android-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Android build from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" android-build
