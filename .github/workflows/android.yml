name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'dawah/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build app bundle and test APK
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease assembleDebug

      - name: Keep the builds as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: dawah-chinese-builds
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk

      # Also publish the unsigned bundle on a separate branch, so it can be signed and handed over.
      - name: Publish builds to the android-build branch
        run: |
          mkdir -p /tmp/out
          cp android/app/build/outputs/bundle/release/*.aab /tmp/out/
          cp android/app/build/outputs/apk/debug/*.apk /tmp/out/
          cd /tmp/out
          git init -q -b android-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Android build from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" android-build
